name: GhostClick theme check
description: Run your GhostClick journeys and page checks on a Shopify theme preview, and fail the build when a journey breaks.
author: GhostClick
branding:
  icon: shopping-cart
  color: orange

inputs:
  ghostclick_token:
    description: Your GhostClick key (starts with gc_ci_). Make one in GhostClick, Settings, GitHub Action, and keep it in a repository secret. The key decides the store and which journeys and pages run.
    required: true
  preview_url:
    description: The preview link of the theme to check, like https://my-store.myshopify.com/?preview_theme_id=123456789. A shared shopifypreview.com link or a theme editor link works too.
    required: false
    default: ""
  theme_id:
    description: The theme's id, instead of preview_url.
    required: false
    default: ""
  store:
    description: Optional. Your .myshopify.com address, checked against the key.
    required: false
    default: ""
  min_page_score:
    description: Fail when a page monitor scores under this (0 to 100). 0 fails only on critical issues.
    required: false
    default: "0"
  fail_on_failure:
    description: Fail the step when a check fails. Set to false to report only.
    required: false
    default: "true"
  timeout_minutes:
    description: How long to wait for the checks before giving up.
    required: false
    default: "30"
  github_token:
    description: Pass secrets.GITHUB_TOKEN to post the results as a pull request comment (needs pull-requests write permission). Leave empty for the job summary only.
    required: false
    default: ""
  api_url:
    description: GhostClick's address. Change it only to test a preview deployment.
    required: false
    default: "https://www.getghostclick.com"

outputs:
  result:
    description: passed or failed
    value: ${{ steps.check.outputs.result }}
  theme_id:
    description: The theme that was tested.
    value: ${{ steps.check.outputs.theme_id }}
  report_urls:
    description: One report link per check, separated by new lines.
    value: ${{ steps.check.outputs.report_urls }}

runs:
  using: composite
  steps:
    - name: Run GhostClick on the theme
      id: check
      shell: bash
      env:
        GHOSTCLICK_TOKEN: ${{ inputs.ghostclick_token }}
        GHOSTCLICK_PREVIEW_URL: ${{ inputs.preview_url }}
        GHOSTCLICK_THEME_ID: ${{ inputs.theme_id }}
        GHOSTCLICK_STORE: ${{ inputs.store }}
        GHOSTCLICK_MIN_PAGE_SCORE: ${{ inputs.min_page_score }}
        GHOSTCLICK_FAIL_ON_FAILURE: ${{ inputs.fail_on_failure }}
        GHOSTCLICK_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        GHOSTCLICK_API_URL: ${{ inputs.api_url }}
        GHOSTCLICK_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: node "$GITHUB_ACTION_PATH/ghostclick-check.mjs"
